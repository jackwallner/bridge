name: Bridge
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk.git
    exactVersion: 18.1.1
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - path: Bridge
      - path: Shared
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.bridge
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-A AppIcon-B AppIcon-C"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        PRODUCT_NAME: "Bridge Trainer"
        PRODUCT_MODULE_NAME: Bridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.2.5"
        CURRENT_PROJECT_VERSION: "25"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bridge/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Meta ad measurement (Shared/Services/MetaAds.swift). Empty = off: no
        # Meta SDK start, no ATT prompt. Fill both from the Meta app's
        # Settings > Basic and Advanced pages, in the same build that updates
        # the App Store privacy labels, and add this app to the trial relay.
        # See .claude/rules/meta-ads.md.
        META_APP_ID: ""
        META_CLIENT_TOKEN: ""
    dependencies:
      - package: RevenueCat
      - package: Facebook
        product: FacebookCore
      - sdk: AdSupport.framework
      - sdk: AppTrackingTransparency.framework

  BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BridgeTests
    dependencies:
      - target: Bridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bridge Trainer.app/Bridge Trainer"

  # App Store screenshot capture. Deliberately NOT in the Bridge scheme's test
  # action: it drives the real UI and takes a minute, and the unit-test loop
  # should stay instant. Drive it with scripts/capture-screenshots.sh.
  BridgeScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BridgeScreenshots
    dependencies:
      - target: Bridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bridge

  # The paywall purchase probe. Its own target rather than a file dropped into
  # BridgeScreenshots: that one runs under a test plan that activates StoreKit
  # Testing, and this has to reach RevenueCat's Test Store instead.
  BridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BridgeUITests
    dependencies:
      - target: Bridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.bridge.uitests
        TEST_TARGET_NAME: Bridge

schemes:
  BridgeUITests:
    build:
      targets:
        Bridge: all
        BridgeUITests: [test]
    test:
      config: Debug
      targets:
        - BridgeUITests
    run:
      config: Debug

  Bridge:
    build:
      targets:
        Bridge: all
    run:
      config: Debug
      storeKitConfiguration: Bridge/Bridge.storekit
    test:
      config: Debug
      targets:
        - BridgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        Bridge: all
        BridgeScreenshots: [test]
    test:
      config: Debug
      targets:
        - BridgeScreenshots
